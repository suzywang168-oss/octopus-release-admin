<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Octopus · Release Admin</title>
<meta name="description" content="Octopus AI 发行管理平台高保真交互原型">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#eff6ff;font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.loader{width:min(420px,calc(100vw - 40px));padding:28px;border:1px solid #243957;border-radius:18px;background:#101e33;box-shadow:0 24px 70px rgba(0,0,0,.35);text-align:center}.mark{width:54px;height:54px;margin:0 auto 18px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,#4f7cff,#29c7df);font-size:24px;font-weight:900}.loader h1{font-size:19px;margin:0}.loader p{color:#8fa2ba;font-size:12px;line-height:1.7}.bar{height:6px;margin-top:20px;border-radius:99px;overflow:hidden;background:#192b45}.bar i{display:block;height:100%;width:34%;border-radius:inherit;background:linear-gradient(90deg,#4f7cff,#37c5df);animation:move 1.1s ease-in-out infinite}@keyframes move{0%{transform:translateX(-120%)}100%{transform:translateX(400%)}}.error{display:none;margin-top:16px;padding:12px;border-radius:10px;background:#2a121b;color:#ff9aac;font-size:12px;text-align:left;line-height:1.6;white-space:pre-wrap}
</style>
</head>
<body>
<main class="loader"><div class="mark">O</div><h1>Octopus Release Admin</h1><p id="status">正在加载发行管理平台...</p><div class="bar"><i></i></div><div class="error" id="error"></div></main>
<script>
(async()=>{
 const status=document.getElementById('status');
 const error=document.getElementById('error');
 const files=['part-00.txt','part-01.txt','part-02a.txt','part-02b.txt','part-02c.txt'];
 try{
  const chunks=[];
  for(let i=0;i<files.length;i++){
   status.textContent=`正在加载站点资源 ${i+1}/${files.length}...`;
   const res=await fetch(`payload-lite/${files[i]}`,{cache:'no-store'});
   if(!res.ok)throw new Error(`资源加载失败：${files[i]} (${res.status})`);
   chunks.push(await res.text());
  }
  status.textContent='正在启动 Octopus...';
  const binary=atob(chunks.join('').replace(/\s/g,''));
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  if(typeof DecompressionStream==='undefined')throw new Error('当前浏览器不支持页面解压，请使用最新版 Chrome、Edge 或 Safari。');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
 }catch(err){status.textContent='站点加载失败';error.style.display='block';error.textContent=err.message+'\n请刷新页面重试。';console.error(err)}
})();
</script>
</body>
</html>
