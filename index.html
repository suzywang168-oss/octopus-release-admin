<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Octopus Release Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07101c;color:#edf5ff;font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.loader{width:min(420px,calc(100% - 40px));padding:28px;border:1px solid #243b59;border-radius:18px;background:#101d2f;box-shadow:0 24px 70px rgba(0,0,0,.35)}h1{margin:0 0 10px;font-size:22px}p{margin:0;color:#7890aa;line-height:1.7;font-size:13px}.bar{height:8px;margin-top:22px;overflow:hidden;border-radius:999px;background:#1a2c45}.bar i{display:block;width:42%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#587cff,#34c7da);animation:move 1.1s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(138%)}}.error{color:#ff8ea0}
</style>
</head>
<body>
<div class="loader"><h1>Octopus Release Admin</h1><p id="status">正在载入交互原型…</p><div class="bar"><i></i></div></div>
<script>
(async()=>{
 const status=document.getElementById('status');
 const parts=Array.from({length:17},(_,i)=>`payload/part-${String(i).padStart(2,'0')}.txt`);
 try{
  const texts=await Promise.all(parts.map(async(path)=>{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(`${path}: ${r.status}`);return r.text()}));
  status.textContent='正在启动管理平台…';
  const b64=texts.join('').replace(/\s+/g,'');
  const binary=atob(b64);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  if(!('DecompressionStream' in window))throw new Error('当前浏览器不支持页面解压，请使用最新版 Chrome、Edge 或 Safari。');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
 }catch(err){status.className='error';status.textContent='载入失败：'+err.message;document.querySelector('.bar').style.display='none';console.error(err)}
})();
</script>
</body>
</html>
