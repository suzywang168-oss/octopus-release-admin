<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Octopus Portal Base</title><style>body{margin:0;background:#07111f;color:#fff;font:14px system-ui;display:grid;place-items:center;min-height:100vh}.l{text-align:center}.b{width:260px;height:5px;background:#19304d;border-radius:9px;overflow:hidden}.b:after{content:'';display:block;width:35%;height:100%;background:#5b7cff;animation:x 1s infinite}@keyframes x{from{transform:translateX(-120%)}to{transform:translateX(400%)}}</style><div class=l><h3>Octopus User Portal</h3><p id=s>Loading workspace…</p><div class=b></div></div><script>(async()=>{try{let a=[];for(let i=0;i<4;i++){s.textContent=`Loading ${i+1}/4…`;let r=await fetch(`site-v7-7/part-0${i}.txt`,{cache:'no-store'});if(!r.ok)throw Error(r.status);a.push(await r.text())}let z=atob(a.join('').replace(/\s/g,'')),u=new Uint8Array(z.length);for(let i=0;i<z.length;i++)u[i]=z.charCodeAt(i);let h=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(h);document.close()}catch(e){s.textContent='Load failed: '+e.message}})()</script>
