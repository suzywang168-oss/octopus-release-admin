<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Octopus User Portal V8.14</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body,#portal{width:100%;height:100%;margin:0;border:0}
    body{overflow:hidden;background:#07111f;color:#eff6ff;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #portal{display:block;visibility:hidden;background:#07111f}
    .loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:#07111f}
    .loader-card{width:min(420px,100%);padding:24px;border:1px solid #213a59;border-radius:16px;background:#0e1c2f;text-align:left;box-shadow:0 22px 60px rgba(0,0,0,.28)}
    .loader-card h1{margin:0 0 8px;font-size:18px}.loader-card p{margin:0 0 18px;color:#91a5bd;line-height:1.6}
    .bar{height:6px;overflow:hidden;border-radius:999px;background:#19304d}.bar:after{content:"";display:block;width:34%;height:100%;background:#5b7cff;animation:loading 1s linear infinite}
    .retry{display:none;width:100%;height:38px;margin-top:16px;border:1px solid #6683df;border-radius:9px;background:#5b7cff;color:#fff;font-weight:700;cursor:pointer}
    .ready #portal{visibility:visible}.ready .loader{display:none}
    @keyframes loading{from{transform:translateX(-120%)}to{transform:translateX(400%)}}
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="loader-card">
      <h1>Octopus User Portal V8.14</h1>
      <p id="status">正在载入冻结版工作空间…</p>
      <div class="bar" id="bar"></div>
      <button class="retry" id="retry" type="button">重新加载</button>
    </div>
  </div>
  <iframe id="portal" title="Octopus User Portal V8.14"></iframe>
  <script>
    (()=>{
      'use strict';
      const frame=document.getElementById('portal');
      const status=document.getElementById('status');
      const retry=document.getElementById('retry');
      const bar=document.getElementById('bar');
      const targetHash=location.hash||'#/production/languages';
      const snapshotBase=new URL('../v814-snapshot/',location.href);
      const files=[
        {src:'auth-stepper-v79.js',optional:true},
        {src:'auth-colors-v711.js',optional:true},
        {src:'modal-schema-a.js'},
        {src:'modal-schema-release.js'},
        {src:'modal-schema-finance.js'},
        {src:'modal-schema-org.js'},
        {src:'modal-patch-v78.js'},
        {src:'crud-patch-v710.js'},
        {src:'workflow-crud-bridge-v712.js'},
        {src:'api-config.js',optional:true},
        {src:'d1-client-v713.js',optional:true},
        {src:'demo-fallback-v714.js'},
        {src:'ui-qa-fix-v813.js'},
        {src:'workflow-actions-v814.js'}
      ];
      let finished=false;
      let lastHash=targetHash;

      retry.addEventListener('click',()=>location.reload());

      function fail(message){
        status.textContent=message;
        bar.style.display='none';
        retry.style.display='block';
      }

      function syncVersion(doc){
        const walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);
        while(walker.nextNode()){
          const node=walker.currentNode;
          if(node.nodeValue&&node.nodeValue.includes('Release User Portal V7.3')){
            node.nodeValue=node.nodeValue.replace(/Release User Portal V7\.3/g,'Release User Portal V8.14');
          }
        }
      }

      function loadScript(doc,index){
        if(index>=files.length){
          syncVersion(doc);
          new MutationObserver(()=>syncVersion(doc)).observe(doc.body,{subtree:true,childList:true,characterData:true});
          finished=true;
          document.body.classList.add('ready');
          return;
        }
        const file=files[index];
        status.textContent=`正在载入功能 ${index+1}/${files.length}…`;
        const script=doc.createElement('script');
        script.src=new URL(file.src+'?v=814206',snapshotBase).href;
        script.onload=()=>loadScript(doc,index+1);
        script.onerror=()=>{
          console.error('Failed to load',script.src);
          if(file.optional) loadScript(doc,index+1);
          else fail(`系统资源加载失败：${file.src}`);
        };
        doc.body.appendChild(script);
      }

      frame.addEventListener('load',()=>{
        try{
          const doc=frame.contentDocument;
          if(!doc?.body){fail('基础工作空间无法访问，请重新加载');return;}
          frame.contentWindow.location.hash=targetHash;
          const waitStarted=Date.now();
          const wait=setInterval(()=>{
            try{
              if(doc.getElementById('modalMask')&&doc.getElementById('pageRoot')){
                clearInterval(wait);
                loadScript(doc,0);
              }else if(Date.now()-waitStarted>15000){
                clearInterval(wait);
                fail('基础工作空间加载超时，请重新加载');
              }
            }catch(error){
              clearInterval(wait);
              fail('基础工作空间初始化失败，请重新加载');
            }
          },120);
        }catch(error){
          console.error(error);
          fail('冻结版页面初始化失败，请重新加载');
        }
      });

      setInterval(()=>{
        if(!finished)return;
        try{
          const nextHash=frame.contentWindow.location.hash;
          if(nextHash&&nextHash!==lastHash){
            lastHash=nextHash;
            history.replaceState(null,'',location.pathname+nextHash);
          }
        }catch(error){}
      },300);

      frame.src=new URL('base-v77.html?v=814206',snapshotBase).href;
    })();
  </script>
</body>
</html>
