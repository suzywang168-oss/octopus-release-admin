<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Octopus Release User Portal</title>
<meta name="theme-color" content="#071426">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#eff6ff;font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.loader{width:min(440px,calc(100vw - 40px));padding:30px;border:1px solid #243957;border-radius:20px;background:#101e33;box-shadow:0 26px 80px rgba(0,0,0,.38);text-align:center}.mark{width:58px;height:58px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#4f7cff,#29c7df);font-size:26px;font-weight:900}.loader h1{font-size:20px;margin:0}.loader p{color:#8fa2ba;font-size:12px;line-height:1.7}.bar{height:6px;margin-top:22px;border-radius:99px;overflow:hidden;background:#192b45}.bar i{display:block;height:100%;width:32%;border-radius:inherit;background:linear-gradient(90deg,#4f7cff,#37c5df);animation:move 1.1s ease-in-out infinite}@keyframes move{0%{transform:translateX(-120%)}100%{transform:translateX(410%)}}.error{display:none;margin-top:17px;padding:13px;border-radius:11px;background:#2a121b;color:#ff9aac;font-size:12px;text-align:left;line-height:1.65;white-space:pre-wrap}.retry{display:none;margin:14px auto 0;border:1px solid #4f7cff;border-radius:9px;background:#4f7cff;color:white;padding:9px 15px;cursor:pointer}
</style>
</head>
<body>
<main class="loader"><div class="mark">O</div><h1>Octopus Release User Portal</h1><p id="status">正在启动制作方发行工作空间...</p><div class="bar"><i></i></div><div class="error" id="error"></div><button class="retry" id="retry">重新加载</button></main>
<script>
(async()=>{
 const status=document.getElementById('status');
 const error=document.getElementById('error');
 const retry=document.getElementById('retry');
 retry.onclick=()=>location.reload();
 const files=['part-00.txt','part-01.txt','part-02.txt','part-03.txt'];
 try{
  const chunks=[];
  for(let i=0;i<files.length;i++){
   status.textContent=`正在加载用户工作空间 ${i+1}/${files.length}...`;
   const res=await fetch(`site-v7-7/${files[i]}`,{cache:'no-store'});
   if(!res.ok)throw new Error(`站点资源加载失败：${files[i]} (${res.status})`);
   chunks.push(await res.text());
  }
  if(typeof DecompressionStream==='undefined')throw new Error('当前浏览器不支持页面解压，请使用最新版 Chrome、Edge 或 Safari。');
  status.textContent='正在进入 Octopus User Portal...';
  const binary=atob(chunks.join('').replace(/\s/g,''));
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  if(!html.includes('Octopus')||!html.includes('mergedNavGroups'))throw new Error('User Portal 页面完整性校验失败');
  document.open();document.write(html);document.close();
 }catch(err){status.textContent='Octopus User Portal 加载失败';error.style.display='block';retry.style.display='block';error.textContent=err.message+'\n请刷新页面，或使用最新版浏览器重试。';console.error(err)}
})();
</script>
</body>
</html>
