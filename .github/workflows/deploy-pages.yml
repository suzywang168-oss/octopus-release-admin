name: Deploy Octopus Admin to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Pages artifact
        env:
          V814_COMMIT: 672ef2d96b499716d6762be8ea8f8ea0f6c63e80
        run: |
          rm -rf _site /tmp/octopus-v814
          mkdir -p _site /tmp/octopus-v814
          rsync -a --exclude '.git' --exclude '_site' ./ _site/
          git archive "$V814_COMMIT" user-portal | tar -x -C /tmp/octopus-v814
          mkdir -p _site/user-portal/v814-snapshot
          cp -a /tmp/octopus-v814/user-portal/. _site/user-portal/v814-snapshot/
          python3 - <<'PY'
          from pathlib import Path

          page = Path('_site/user-portal/v814-snapshot/v78/index.html')
          source = page.read_text(encoding='utf-8')
          needle = "document.body.classList.add('ready')"
          version_patch = "const syncVersion=()=>{const w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);while(w.nextNode()){const n=w.currentNode;if(n.nodeValue&&n.nodeValue.includes('Release User Portal V7.3'))n.nodeValue=n.nodeValue.replace(/Release User Portal V7\\.3/g,'Release User Portal V8.14')}};syncVersion();new MutationObserver(syncVersion).observe(d.body,{subtree:true,childList:true,characterData:true});document.body.classList.add('ready')"
          if needle not in source:
              raise SystemExit('Unable to patch the V8.14 version label')
          source = source.replace(needle, version_patch, 1)

          scripts = (
              '<script src="../../v814-content-generation-layout-fix.js?v=2"></script>'
              '<script src="../../v814-generation-entry-fix.js?v=1"></script>'
              '<script src="../../v814-button-runtime-fix.js?v=1"></script>'
          )
          if 'v814-generation-entry-fix.js' not in source:
              if '</body>' not in source:
                  raise SystemExit('Unable to attach the V8.14 runtime patches')
              source = source.replace('</body>', scripts + '</body>', 1)

          page.write_text(source, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
