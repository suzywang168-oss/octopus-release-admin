name: Deploy Octopus Admin to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Pages artifact
        env:
          V814_COMMIT: 672ef2d96b499716d6762be8ea8f8ea0f6c63e80
        run: |
          rm -rf _site /tmp/octopus-v814
          mkdir -p _site /tmp/octopus-v814
          rsync -a --exclude '.git' --exclude '_site' ./ _site/
          git archive "$V814_COMMIT" user-portal | tar -x -C /tmp/octopus-v814
          mkdir -p _site/user-portal/v814-snapshot
          cp -a /tmp/octopus-v814/user-portal/. _site/user-portal/v814-snapshot/

          python3 - <<'PY'
          from pathlib import Path

          page = Path('_site/user-portal/v814-snapshot/v78/index.html')
          source = page.read_text(encoding='utf-8')
          needle = "document.body.classList.add('ready')"
          version_patch = "const syncVersion=()=>{const w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);while(w.nextNode()){const n=w.currentNode;if(n.nodeValue&&n.nodeValue.includes('Release User Portal V7.3'))n.nodeValue=n.nodeValue.replace(/Release User Portal V7\\.3/g,'Release User Portal V8.14')}};syncVersion();new MutationObserver(syncVersion).observe(d.body,{subtree:true,childList:true,characterData:true});document.body.classList.add('ready')"
          if needle not in source:
              raise SystemExit('Unable to patch the V8.14 version label')
          page.write_text(source.replace(needle, version_patch, 1), encoding='utf-8')

          loader = Path('_site/user-portal/v814/index.html')
          loader_source = loader.read_text(encoding='utf-8')
          for script in (
              "        {src:'crud-patch-v710.js'},\n",
              "        {src:'workflow-crud-bridge-v712.js'},\n",
              "        {src:'workflow-actions-v814.js'}\n",
              "        {src:'ui-qa-fix-v813.js'},\n",
          ):
              loader_source = loader_source.replace(script, '')
          loader_source = loader_source.replace('814206', '814233')
          loader.write_text(loader_source, encoding='utf-8')
          PY

          python3 user-portal/v814-build-patch.py _site/user-portal/v814-snapshot/demo-fallback-v714.js
          python3 user-portal/v814-stability-patch.py _site/user-portal/v814-snapshot/demo-fallback-v714.js
          python3 user-portal/v814-action-patch.py _site/user-portal/v814-snapshot/demo-fallback-v714.js
          python3 user-portal/v814-final-ui-patch.py _site/user-portal/v814-snapshot/demo-fallback-v714.js
          python3 user-portal/v814-generation-loop-patch.py _site/user-portal/v814-snapshot/demo-fallback-v714.js

          node --check _site/user-portal/v814-snapshot/demo-fallback-v714.js

          grep -q 'v814-stable-list-tabs' _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q 'v814-stability-style' _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q 'v814-action-style' _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q 'v814-final-ui-style' _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q 'v814-generation-loop-style' _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q 'function actionModal' _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q 'function recordEditor' _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q 'function archiveRecord' _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q 'function mergeGenerationHeader' _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q 'function commitGenerationEditor' _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q 'function nextGenerationStep' _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q 'box.dataset.generationRoute=active' _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q "if(q.target.closest('.v80-modal'))return" _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q 'data-v81-draft' _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q 'data-v81-regenerate' _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q 'data-v81-save' _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q 'GEN_LOOP_STORE' _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q '确认生成并入库' _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q '保存新版本并采用' _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q "\['next','进入标题生成'\]" _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q "\['next','进入封面生成'\]" _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q "\['next','提交发布'\]" _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q "\['recordEdit','编辑'\]" _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q "\['recordArchive','归档'\]" _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q "\['asset','查看源内容'\]" _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q "\['extract','查看 AI 提炼'\]" _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q 'generationListByModule' _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q "window.addEventListener('hashchange',syncRoute)" _site/user-portal/v814-snapshot/demo-fallback-v714.js
          grep -q 'grid-template-columns:repeat(2,minmax(0,1fr))' _site/user-portal/v814-snapshot/demo-fallback-v714.js

          if grep -q 'box.dataset.route=active' _site/user-portal/v814-snapshot/demo-fallback-v714.js; then
            echo 'Generation editor still exposes a navigation data-route attribute' >&2
            exit 1
          fi
          if grep -q "\['source','查看内容'\]" _site/user-portal/v814-snapshot/demo-fallback-v714.js; then
            echo 'Redundant title source button is still present' >&2
            exit 1
          fi
          if grep -q "\['source','查看剧情'\]" _site/user-portal/v814-snapshot/demo-fallback-v714.js; then
            echo 'Redundant cover story button is still present' >&2
            exit 1
          fi
          if grep -Eq 'crud-patch-v710.js|workflow-crud-bridge-v712.js|workflow-actions-v814.js|ui-qa-fix-v813.js' _site/user-portal/v814/index.html; then
            echo 'A competing legacy runtime is still attached' >&2
            exit 1
          fi
          if grep -q 'setInterval(()=>.*nav()},250)' _site/user-portal/v814-snapshot/demo-fallback-v714.js; then
            echo 'Legacy navigation polling is still present' >&2
            exit 1
          fi
          if grep -q 'v814-button-runtime-fix.js' _site/user-portal/v814-snapshot/v78/index.html; then
            echo 'Legacy runtime patch is still attached' >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
