name: Deploy Octopus Admin to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Pages artifact
        env:
          V814_CONTENT_COMMIT: 672ef2d96b499716d6762be8ea8f8ea0f6c63e80
          V814_STABLE_COMMIT: f3def25d7cef4e16d3120833ad517eb70f4f2caf
          V814_CACHE_VERSION: 814306
        run: |
          rm -rf _site /tmp/octopus-v814-base /tmp/octopus-v814-stable
          mkdir -p _site /tmp/octopus-v814-base /tmp/octopus-v814-stable

          rsync -a --exclude '.git' --exclude '_site' ./ _site/
          git archive "$V814_CONTENT_COMMIT" user-portal | tar -x -C /tmp/octopus-v814-base
          git archive "$V814_STABLE_COMMIT" user-portal | tar -x -C /tmp/octopus-v814-stable

          rm -rf _site/user-portal/v814-snapshot _site/user-portal/v814
          mkdir -p _site/user-portal/v814-snapshot _site/user-portal/v814
          cp -a /tmp/octopus-v814-base/user-portal/. _site/user-portal/v814-snapshot/
          cp /tmp/octopus-v814-stable/user-portal/v814/index.html _site/user-portal/v814/index.html

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          cache_version = os.environ['V814_CACHE_VERSION']

          version_page = Path('_site/user-portal/v814-snapshot/v78/index.html')
          version_source = version_page.read_text(encoding='utf-8')
          ready_marker = "document.body.classList.add('ready')"
          version_patch = "const syncVersion=()=>{const w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);while(w.nextNode()){const n=w.currentNode;if(n.nodeValue&&n.nodeValue.includes('Release User Portal V7.3'))n.nodeValue=n.nodeValue.replace(/Release User Portal V7\\.3/g,'Release User Portal V8.14')}};syncVersion();new MutationObserver(syncVersion).observe(d.body,{subtree:true,childList:true,characterData:true});document.body.classList.add('ready')"
          if ready_marker not in version_source:
              raise SystemExit('Unable to patch the V8.14 version label')
          version_page.write_text(version_source.replace(ready_marker, version_patch, 1), encoding='utf-8', newline='\n')

          loader = Path('_site/user-portal/v814/index.html')
          loader_source = loader.read_text(encoding='utf-8')
          for script in (
              "        {src:'crud-patch-v710.js'},\n",
              "        {src:'workflow-crud-bridge-v712.js'},\n",
              "        {src:'workflow-actions-v814.js'}\n",
              "        {src:'ui-qa-fix-v813.js'},\n",
          ):
              loader_source = loader_source.replace(script, '')
          loader_source = re.sub(r'814\d{3}', cache_version, loader_source)
          loader.write_text(loader_source, encoding='utf-8', newline='\n')
          PY

          TARGET=_site/user-portal/v814-snapshot/demo-fallback-v714.js
          STABLE=/tmp/octopus-v814-stable/user-portal

          python3 "$STABLE/v814-build-patch.py" "$TARGET"
          python3 "$STABLE/v814-stability-patch.py" "$TARGET"
          python3 "$STABLE/v814-action-patch.py" "$TARGET"
          python3 "$STABLE/v814-final-ui-patch.py" "$TARGET"
          python3 "$STABLE/v814-generation-loop-patch.py" "$TARGET"
          python3 "$STABLE/v814-generation-state-machine-patch.py" "$TARGET"
          python3 "$STABLE/v814-search-editor-layout-patch.py" "$TARGET"
          python3 user-portal/v814-list-recovery-patch.py "$TARGET"
          python3 user-portal/v814-project-route-patch.py "$TARGET"
          python3 user-portal/v814-bulk-action-position-patch.py "$TARGET"
          python3 user-portal/v814-todo-route-close-icon-patch.py "$TARGET"

          node --check "$TARGET"

          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('_site/user-portal/v814/index.html'),
              Path('_site/user-portal/v814-snapshot/base-v77.html'),
              Path('_site/user-portal/v814-snapshot/v78/index.html'),
              Path('_site/user-portal/v814-snapshot/demo-fallback-v714.js'),
          ]
          suspicious = ('锟斤拷','鐢','璇','缁','绠','鏍','鍒','瑙','鐨','锛','闂','鍙','绔','浠','妯','澶')
          for path in files:
              raw = path.read_bytes()
              if raw.startswith(b'\xef\xbb\xbf'):
                  raise SystemExit(f'Unexpected UTF-8 BOM: {path}')
              text = raw.decode('utf-8')
              if '\ufffd' in text:
                  raise SystemExit(f'Unicode replacement character found: {path}')
              if any(token in text for token in suspicious):
                  raise SystemExit(f'Likely mojibake found: {path}')
          if '<meta charset="utf-8">' not in files[0].read_text(encoding='utf-8'):
              raise SystemExit('The V8.14 loader is missing an explicit UTF-8 charset')
          PY

          grep -q 'v814-list-recovery-style' "$TARGET"
          grep -q 'octopus-v814-generation-loop-v3-clean' "$TARGET"
          grep -q 'function overviewProjectRoute' "$TARGET"
          grep -q "action==='enter'&&active==='overview'" "$TARGET"
          grep -q "return 'production.upload'" "$TARGET"
          grep -q "return 'production.languages'" "$TARGET"
          grep -q "return 'release.titles'" "$TARGET"
          grep -q "return 'release.covers'" "$TARGET"
          grep -q "return 'release.publish'" "$TARGET"
          grep -q 'v814-bulk-action-position-style' "$TARGET"
          grep -q 'v814-bulk-right' "$TARGET"
          grep -q 'data-v81-bulk>批量生成' "$TARGET"
          grep -q 'function todoTaskRoute' "$TARGET"
          grep -q 'function enterTodoTask' "$TARGET"
          grep -q "action==='process'&&active==='todo'" "$TARGET"
          grep -q 'v814-icon-close' "$TARGET"
          grep -q 'v814-todo-route-close-icon-style' "$TARGET"
          grep -q 'PingFang SC' "$TARGET"
          grep -q 'font-size:12px!important' "$TARGET"
          grep -q 'v814-search-editor-layout-style' "$TARGET"
          grep -q 'function setGenerationEditorStep' "$TARGET"
          grep -q 'function commitGenerationEditor' "$TARGET"
          grep -q 'generationListByModule' "$TARGET"
          grep -q "window.addEventListener('hashchange',syncRoute)" "$TARGET"

          if grep -q '<button type="button" class="btn" data-close>关闭</button>' "$TARGET"; then
            echo 'A text-based modal close button is still present' >&2
            exit 1
          fi
          if grep -Eq 'v814-generation-toolbar-position-style|v814-batch-editor-style' "$TARGET"; then
            echo 'A later unstable generation patch entered the clean V8.14 build' >&2
            exit 1
          fi
          if grep -Eq 'crud-patch-v710.js|workflow-crud-bridge-v712.js|workflow-actions-v814.js|ui-qa-fix-v813.js' _site/user-portal/v814/index.html; then
            echo 'A competing legacy runtime is still attached' >&2
            exit 1
          fi
          if grep -q 'setInterval(()=>.*nav()},250)' "$TARGET"; then
            echo 'Legacy navigation polling is still present' >&2
            exit 1
          fi

          rm -rf _site/v814 _site/v814-snapshot
          cp -a _site/user-portal/v814 _site/v814
          cp -a _site/user-portal/v814-snapshot _site/v814-snapshot

          python3 - <<'PY'
          from pathlib import Path
          source = Path('_site/v814/index.html').read_text(encoding='utf-8')
          source = source.replace("new URL('../v814-snapshot/',location.href)", "new URL('./v814-snapshot/',location.href)")
          Path('_site/octopus-v814.html').write_text(source, encoding='utf-8', newline='\n')
          PY

          test -f _site/v814/index.html
          test -f _site/v814-snapshot/base-v77.html
          test -f _site/v814-snapshot/demo-fallback-v714.js
          test -f _site/octopus-v814.html
          grep -q "new URL('./v814-snapshot/',location.href)" _site/octopus-v814.html
          grep -q 'Octopus User Portal V8.14' _site/octopus-v814.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
