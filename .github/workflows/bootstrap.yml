name: Bootstrap Octopus Source

on:
  push:
    branches:
      - main
      - feat/v6-deep-submodules
    paths:
      - ".github/workflows/bootstrap.yml"
      - ".bootstrap/**"
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source package
        shell: bash
        run: |
          set -euo pipefail
          test -d .bootstrap
          cat .bootstrap/part-*.txt > /tmp/octopus.zip.b64
          base64 --decode /tmp/octopus.zip.b64 > /tmp/octopus.zip
          rm -rf /tmp/octopus-source
          mkdir -p /tmp/octopus-source
          unzip -q /tmp/octopus.zip -d /tmp/octopus-source
          rsync -a --delete --exclude '.git/' --exclude '.bootstrap/' /tmp/octopus-source/ ./
          rm -rf .bootstrap

      - name: Commit initialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: initialize Octopus Cloudflare D1 application"
          git push origin HEAD
