name: Publish Octopus Admin V8

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate V8 site
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q "Octopus Admin V8.0" index.html
          grep -q "ADMIN ACCESS ONLY" index.html
          grep -q "id=\"loginView\"" index.html
          grep -q "id=\"logoutBtn\"" index.html
          grep -q "个人账户设置" index.html
          grep -q "Admin Sign-in" index.html
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          printf '%s\n' "$GITHUB_SHA" > _site/deployment-proof.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
