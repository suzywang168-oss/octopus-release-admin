name: Publish Octopus Admin V7.3

on:
  push:
    branches: [main]
    paths:
      - ".site-v73/**"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: octopus-admin-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Octopus Admin V7.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat \
            .site-v73/part-00.txt \
            .site-v73/part-01.txt \
            .site-v73/part-02.txt \
            .site-v73/part-03.txt \
            | base64 --decode | gunzip > _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html
          grep -q "Octopus Admin V7.3" _site/index.html
          grep -q "API 与字段映射" _site/index.html
          grep -q "事件与 SLA" _site/index.html
          grep -q "activeTab" _site/index.html
          if grep -q "DecompressionStream" _site/index.html; then
            echo "Browser-side loader must not be deployed"
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Octopus Admin V7.3
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout repository for deployment status
        uses: actions/checkout@v4

      - name: Record V7.3 deployment
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '{"status":"success","version":"v7.3-dense","site_url":"%s","source_commit":"%s","architecture":"platform-admin","delivery":"single-html","tabs":"independent-data-views","reported_at":"%s"}\n' "$PAGE_URL" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > site-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-status.json
          git diff --cached --quiet || git commit -m "chore: record Octopus Admin V7.3 deployment"
          git push
