name: Publish Octopus Admin V7

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".site-v7/**"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: octopus-admin-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Octopus Admin V7 site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/site-v7
          cp index.html _site/index.html
          cp .site-v7/part-*.txt _site/site-v7/
          touch _site/.nojekyll
          test -s _site/index.html
          for f in part-00.txt part-01.txt part-02.txt part-03.txt part-04.txt part-05.txt; do
            test -s "_site/site-v7/$f"
          done
          grep -q "Octopus Admin V7" _site/index.html
          grep -q "site-v7/" _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Octopus Admin V7
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout repository for deployment status
        uses: actions/checkout@v4

      - name: Record V7 deployment
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '{"status":"success","version":"v7","site_url":"%s","source_commit":"%s","architecture":"platform-admin","reported_at":"%s"}\n' "$PAGE_URL" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > site-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-status.json
          git diff --cached --quiet || git commit -m "chore: record Octopus Admin V7 deployment"
          git push
