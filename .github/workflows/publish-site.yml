name: Publish Octopus Admin V7.9 Single File

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".site-v75b/**"
      - ".site-v76/**"
      - ".site-v77/**"
      - ".site-v78/**"
      - ".site-v79/**"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: octopus-admin-pages
  cancel-in-progress: true

env:
  FINAL_FILE: octopus-admin-v79-final.html

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build self-contained Octopus Admin V7.9
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat .site-v75b/part-*.txt | base64 --decode | gunzip > /tmp/octopus-base.html

          python3 - <<'PY'
          from pathlib import Path
          import os

          base = Path('/tmp/octopus-base.html').read_text(encoding='utf-8')
          scripts = [
              Path('.site-v76/auth-v76.js').read_text(encoding='utf-8'),
              Path('.site-v77/account-settings-v77.js').read_text(encoding='utf-8'),
              Path('.site-v78/ux-i18n-v78.js').read_text(encoding='utf-8'),
              Path('.site-v79/admin-login-v79.js').read_text(encoding='utf-8'),
          ]
          html = base.replace('Octopus Admin V7.5 · CRUD', 'Octopus Admin V7.9 · Admin Login · 中文 / EN')
          html = html.replace('Platform Console · V7.5', 'Platform Console · V7.9')
          cache = (
              '<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">'
              '<meta http-equiv="Pragma" content="no-cache">'
              '<meta http-equiv="Expires" content="0">'
          )
          html = html.replace('</head>', cache + '</head>', 1)
          inline = ''.join('<script>\n' + source + '\n</script>' for source in scripts)
          html = html.replace('</body>', inline + '</body>', 1)
          final_file = os.environ['FINAL_FILE']
          Path('_site', final_file).write_text(html, encoding='utf-8')
          Path('_site/index.html').write_text(html, encoding='utf-8')
          PY

          touch _site/.nojekyll
          test -s "_site/${FINAL_FILE}"
          test -s _site/index.html
          cmp "_site/${FINAL_FILE}" _site/index.html
          grep -q "Octopus Admin V7.9" "_site/${FINAL_FILE}"
          grep -q "ADMIN ACCESS ONLY" "_site/${FINAL_FILE}"
          grep -q "管理员登录" "_site/${FINAL_FILE}"
          grep -q "Admin Sign-in" "_site/${FINAL_FILE}"
          grep -q "Partner Management" "_site/${FINAL_FILE}"
          grep -q "个人账户设置" "_site/${FINAL_FILE}"
          grep -q "退出账号" "_site/${FINAL_FILE}"
          grep -q "octopus-ui-language-v78" "_site/${FINAL_FILE}"
          if grep -R -q "DecompressionStream" _site; then
            echo "Browser-side loader must not be deployed"
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Octopus Admin V7.9 single file
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout repository for deployment status
        uses: actions/checkout@v4

      - name: Record single-file deployment
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          FINAL_URL="${PAGE_URL}${FINAL_FILE}?release=20260731-1802"
          printf '{"status":"success","version":"v7.9-single-file","site_url":"%s","root_url":"%s","source_commit":"%s","architecture":"platform-admin","delivery":"github-pages-self-contained-html","visual_style":"original-navy","crud":"create-read-update-delete-bulk","auth":"admin-login-only-logout-session","account_settings":"profile-security-session-data","i18n":"zh-CN-en-US","storage":"browser-local","reported_at":"%s"}\n' "$FINAL_URL" "$PAGE_URL" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > site-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-status.json
          git diff --cached --quiet || git commit -m "chore: record V7.9 single-file deployment"
          git push
