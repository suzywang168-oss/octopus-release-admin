name: Publish Octopus Admin Final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build final self-contained site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat .site-v75b/part-*.txt | base64 --decode | gunzip > /tmp/octopus-base.html

          python3 - <<'PY'
          from pathlib import Path

          base = Path('/tmp/octopus-base.html').read_text(encoding='utf-8')
          sources = [
              Path('.site-v76/auth-v76.js').read_text(encoding='utf-8'),
              Path('.site-v77/account-settings-v77.js').read_text(encoding='utf-8'),
              Path('.site-v78/ux-i18n-v78.js').read_text(encoding='utf-8'),
              Path('.site-v79/admin-login-v79.js').read_text(encoding='utf-8'),
          ]

          html = base.replace(
              'Octopus Admin V7.5 · CRUD',
              'Octopus Admin V7.9 · Admin Login · 中文 / EN'
          )
          html = html.replace(
              'Platform Console · V7.5',
              'Platform Console · V7.9'
          )
          cache = (
              '<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">'
              '<meta http-equiv="Pragma" content="no-cache">'
              '<meta http-equiv="Expires" content="0">'
          )
          html = html.replace('</head>', cache + '</head>', 1)
          inline = ''.join('<script>\n' + source + '\n</script>' for source in sources)
          html = html.replace('</body>', inline + '</body>', 1)

          Path('_site/index.html').write_text(html, encoding='utf-8')
          Path('_site/octopus-admin-v79-final.html').write_text(html, encoding='utf-8')
          PY

          printf '%s\n' "$GITHUB_SHA" > _site/deployment-proof.txt
          touch _site/.nojekyll

          test -s _site/index.html
          test -s _site/octopus-admin-v79-final.html
          cmp _site/index.html _site/octopus-admin-v79-final.html
          grep -q "Octopus Admin V7.9" _site/index.html
          grep -q "ADMIN ACCESS ONLY" _site/index.html
          grep -q "管理员登录" _site/index.html
          grep -q "Admin Sign-in" _site/index.html
          grep -q "Partner Management" _site/index.html
          grep -q "个人账户设置" _site/index.html
          grep -q "退出账号" _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
