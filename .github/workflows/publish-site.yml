name: Publish Octopus Site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "payload-lite/**"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: octopus-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/index.html
          cp -R payload-lite _site/payload-lite
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/payload-lite/part-00.txt
          test -s _site/payload-lite/part-01.txt
          test -s _site/payload-lite/part-02a.txt
          test -s _site/payload-lite/part-02b.txt
          test -s _site/payload-lite/part-02c.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
