name: Publish Octopus Admin V7

on:
  push:
    branches: [main]
    paths:
      - ".site-v7/**"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: octopus-admin-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build standalone Octopus Admin V7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat \
            .site-v7/part-00.txt \
            .site-v7/part-01.txt \
            .site-v7/part-02.txt \
            .site-v7/part-03.txt \
            .site-v7/part-04.txt \
            .site-v7/part-05.txt \
            | base64 --decode | gunzip > _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html
          grep -q "Octopus Admin V7" _site/index.html
          grep -q "workspace.overview" _site/index.html
          grep -q "合作方成员审计" _site/index.html
          grep -q "渠道联通性监控" _site/index.html
          if grep -q "DecompressionStream" _site/index.html; then
            echo "Unexpected browser-side loader found"
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Octopus Admin V7
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout repository for deployment status
        uses: actions/checkout@v4

      - name: Record standalone V7 deployment
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '{"status":"success","version":"v7-standalone","site_url":"%s","source_commit":"%s","architecture":"platform-admin","delivery":"single-html","reported_at":"%s"}\n' "$PAGE_URL" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > site-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-status.json
          git diff --cached --quiet || git commit -m "chore: record standalone Octopus Admin V7 deployment"
          git push
