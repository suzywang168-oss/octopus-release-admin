appId: chatgpt.suzywang168.octopus.admin
productName: Octopus Admin Console
artifactName: Octopus-Admin-${version}-${arch}.${ext}
directories:
  output: dist/admin
files:
  - src/**/*
  - package.json
extraMetadata:
  main: src/admin.js
mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch: universal
win:
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
