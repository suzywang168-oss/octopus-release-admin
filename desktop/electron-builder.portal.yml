appId: chatgpt.suzywang168.octopus.portal
productName: Octopus Release Portal
artifactName: Octopus-Portal-${version}-${arch}.${ext}
directories:
  output: dist/portal
files:
  - src/**/*
  - package.json
extraMetadata:
  main: src/portal.js
mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch: universal
win:
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
